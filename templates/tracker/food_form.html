{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card p-4">
      <h5 class="fw-bold mb-1" style="color:#0f2a3c;"><i class="bi bi-basket"></i> {{ title }}</h5>
      <p class="small text-muted mb-3">Food details — name, quantity, expiry date</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label small fw-semibold">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}
          </div>
        {% endfor %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-teal px-4">{{ btn }}</button>
          <a href="{% url 'food_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
