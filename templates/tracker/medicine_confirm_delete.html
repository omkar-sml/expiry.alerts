{% extends 'base.html' %}
{% block title %}Delete Medicine{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center">
      <i class="bi bi-exclamation-triangle fs-1 text-danger"></i>
      <h5 class="fw-bold mt-2" style="color:#0f2a3c;">Delete {{ type }}?</h5>
      <p class="text-muted">Are you sure you want to delete <strong>{{ item.name }}</strong> (expiry: {{ item.expiry_date|date:"d M Y" }})? This cannot be undone.</p>
      <form method="post" class="d-flex justify-content-center gap-2 mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
        <a href="{% url 'medicine_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
